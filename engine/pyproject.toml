[project]
name = "cleanvoice-engine"
version = "1.0.0"
description = "Dialogue cleaning engine for the CleanVoice app"
requires-python = ">=3.11,<3.12"
# Pinned to the set verified working together: newer torchaudio removes an API deepfilternet 0.5.6 uses.
dependencies = [
    "torch==2.0.1",
    "torchaudio==2.0.2",
    "deepfilternet==0.5.6",
    "numpy==1.26.4",
    "scipy>=1.11,<1.15",
    "soundfile>=0.12",
    "imageio-ffmpeg>=0.5",
    "onnxruntime>=1.17,<1.24",
]

[tool.uv]
package = false
